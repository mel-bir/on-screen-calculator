<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div id="container">
            <input type="text" id="display" readonly>
            <button>0</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>=</button>
            <button>C</button>
            <button>÷</button>
            <button>X</button>
            <button>-</button>
            <button>+</button>
        </div>

        <script type="module" src="java.js"></script>
    </body>
</html>
